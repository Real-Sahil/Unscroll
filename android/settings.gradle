pluginManagement {
    def flutterSdkPath = {
        def flutterRoot = System.env.FLUTTER_ROOT
        if (flutterRoot) {
            return flutterRoot
        }

        def flutterProperties = new File(rootDir.parent, '.flutter')
        if (flutterProperties.isDirectory()) {
            return flutterProperties.getAbsolutePath()
        }
        return "../flutter"
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

include ":app"

def localProperties = new File(rootDir, "local.properties")
def properties = new Properties()

if (localProperties.exists()) {
    localProperties.withReader("UTF-8") { reader -> properties.load(reader) }
}

def flutterSdkPath = properties.getProperty("flutter.sdk")
if (flutterSdkPath == null) {
    throw new GradleException("flutter.sdk not set in local.properties")
}
