pluginManagement {
    def flutterSdkPath = {
        def flutterRoot = System.env.FLUTTER_ROOT
        if (flutterRoot) {
            return flutterRoot
        }

        def flutterProperties = new File(rootDir.parent, '.flutter')
        if (flutterProperties.isDirectory()) {
            return flutterProperties.getAbsolutePath()
        }
        return "../flutter"
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

include ":app"

def localProperties = new File(rootDir, "local.properties")
def properties = new Properties()

assert localProperties.exists()
localProperties.withReader("UTF-8") { reader -> properties.load(reader) }

def flutterSdkPath = properties.getProperty("flutter.sdk")
assert flutterSdkPath != null, "flutter.sdk not set in local.properties"

def flutterRoot = file(flutterSdkPath).absoluteFile.getParentFile().getAbsolutePath()

logger.quiet("Flutter root: $flutterRoot")

def plugins = new Properties()
def pluginsFile = new File(flutterRoot, ".pubspec.yaml")
if (pluginsFile.exists()) {
    pluginsFile.withReader("UTF-8") { reader -> plugins.load(reader) }
}

plugins.each { name, _ ->
    def pluginDirectory = new File(flutterRoot, ".pub-cache/hosted/pub.dartlang.org/$name")
    assert pluginDirectory.exists()
}
