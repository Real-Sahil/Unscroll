name = "unscroll-api"
account_id = "7ee28ffcbcd3bf2e0c4d6ef4f561906f"
workers_dev = true
main = "dist/index.js"

[env.production]
name = "unscroll-api-prod"
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "unscroll"
database_id = "ca72fab6-a375-4f0b-bea8-64aa999d29f9"

[[env.production.kv_namespaces]]
binding = "KV"
id = "unscroll_rate_limit_kv_prod"

[env.development]
name = "unscroll-api-dev"
vars = { ENVIRONMENT = "development" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "unscroll"
database_id = "ca72fab6-a375-4f0b-bea8-64aa999d29f9"

[[env.development.kv_namespaces]]
binding = "KV"
id = "unscroll_rate_limit_kv"

[build]
command = "npm run build"
cwd = "./"
