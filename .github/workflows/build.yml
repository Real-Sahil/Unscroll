name: Build Flutter Apps
description: 'Automated build for iOS and Android Flutter apps'

on:
  push:
    branches: [ main, release ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android-only
          - ios-only

jobs:
  build-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'android-only'
    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'

      - name: Get dependencies
        run: |
          echo "📦 Installing Flutter dependencies..."
          flutter pub get
          flutter pub upgrade

      - name: Setup Android signing
        run: |
          echo "🔐 Configuring Android signing..."
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../app/key.jks
          EOF
          echo "✅ Signing configuration ready"

      - name: Build APK
        run: |
          echo "🔨 Building Android APK..."
          flutter build apk --release --verbose
          echo "✅ APK build complete"

      - name: Build AAB (App Bundle)
        run: |
          echo "📦 Building Android App Bundle..."
          flutter build appbundle --release --verbose
          echo "✅ AAB build complete"

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: unscroll-app-release.apk
          path: build/app/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v3
        with:
          name: unscroll-app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-ios:
    runs-on: macos-latest
    if: github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'ios-only'
    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'

      - name: Get dependencies
        run: |
          echo "📦 Installing Flutter dependencies..."
          flutter pub get
          flutter pub upgrade

      - name: Build iOS
        run: |
          echo "🔨 Building iOS app..."
          flutter build ios --release --no-codesign --verbose
          echo "✅ iOS build complete"

      - name: Package IPA
        run: |
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r unscroll.ipa Payload/
          mv unscroll.ipa ../../..

      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: unscroll-app-release.ipa
          path: unscroll.ipa
