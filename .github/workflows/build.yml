name: Build Flutter Apps

on:
  push:
    branches: [ main, release, claude/dart-mobile-content-blocker-11wcm3 ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.13.0

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --branch $FLUTTER_VERSION --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          export PATH="$HOME/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter doctor -v
          flutter pub get

      - name: Build APK
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter build apk --release --verbose 2>&1 | tee build.log
          echo "✅ APK complete"

      - name: Find and Copy APK
        if: success()
        run: |
          echo "=== Listing build directory structure ==="
          ls -la build/ 2>/dev/null || echo "build/ does not exist"
          echo ""
          echo "=== Searching for APK files (all locations) ==="
          find . -name "*.apk" -type f 2>/dev/null | tee apk_list.txt || echo "No .apk files found in any directory"
          echo ""
          echo "=== Checking specific paths ==="
          echo "Checking: build/app/outputs/"
          ls -la build/app/outputs/ 2>/dev/null || echo "  -> Not found"
          echo ""
          echo "Checking: build/app/outputs/apk/"
          ls -la build/app/outputs/apk/ 2>/dev/null || echo "  -> Not found"
          echo ""
          echo "Checking: build/app/outputs/apk/release/"
          ls -la build/app/outputs/apk/release/ 2>/dev/null || echo "  -> Not found"
          echo ""
          echo "=== Attempting to copy APK ==="
          if [ -s apk_list.txt ]; then
            APK_FILE=$(head -1 apk_list.txt)
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" ./app-release.apk && echo "✅ Copied successfully"
          else
            echo "❌ No APK file found in search results"
            echo "This means flutter build apk did not produce an APK file"
          fi

      - name: Upload Build Log (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unscroll-app-release.apk
          path: app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --branch $FLUTTER_VERSION --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          export PATH="$HOME/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter doctor -v
          flutter pub get

      - name: Build iOS
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter build ios --release --no-codesign --verbose 2>&1 | tee build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log

      - name: Package IPA
        if: success()
        run: |
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r unscroll.ipa Payload/
          mv unscroll.ipa ../../..

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unscroll-app-release.ipa
          path: unscroll.ipa
