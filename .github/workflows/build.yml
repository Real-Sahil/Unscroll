name: Build Flutter Apps

on:
  push:
    branches: [ main, release, claude/dart-mobile-content-blocker-11wcm3 ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.13.0

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --branch $FLUTTER_VERSION --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          export PATH="$HOME/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter doctor -v
          flutter pub get

      - name: Build APK
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter build apk --release --verbose 2>&1 | tee build.log
          echo "✅ APK complete"

      - name: Find and Copy APK
        if: success()
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null | head -20
          echo ""
          echo "=== Checking standard paths ==="
          ls -la build/app/outputs/apk/release/ 2>/dev/null || echo "build/app/outputs/apk/release/ not found"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "build/app/outputs/flutter-apk/ not found"
          echo ""
          echo "=== Copying APK to root if found ==="
          if find . -name "*.apk" -type f -print -quit >/dev/null 2>&1; then
            APK_FILE=$(find . -name "*.apk" -type f -print -quit)
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" ./app-release.apk || echo "Copy failed"
          else
            echo "No APK found!"
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unscroll-app-release.apk
          path: app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --branch $FLUTTER_VERSION --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          export PATH="$HOME/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter doctor -v
          flutter pub get

      - name: Build iOS
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter build ios --release --no-codesign --verbose 2>&1 | tee build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log

      - name: Package IPA
        if: success()
        run: |
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r unscroll.ipa Payload/
          mv unscroll.ipa ../../..

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unscroll-app-release.ipa
          path: unscroll.ipa
