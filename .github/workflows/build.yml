name: Build Flutter Apps

on:
  push:
    branches: [ main, release, claude/dart-mobile-content-blocker-11wcm3 ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.13.0

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --branch $FLUTTER_VERSION --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          flutter config --no-analytics
          flutter doctor -v
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --verbose 2>&1 | tee build.log
          echo "✅ APK complete"

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unscroll-app-release.apk
          path: build/app/outputs/apk/release/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --branch $FLUTTER_VERSION --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          flutter config --no-analytics
          flutter doctor -v
          flutter pub get

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --verbose 2>&1 | tee build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log

      - name: Package IPA
        if: success()
        run: |
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r unscroll.ipa Payload/
          mv unscroll.ipa ../../..

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unscroll-app-release.ipa
          path: unscroll.ipa
