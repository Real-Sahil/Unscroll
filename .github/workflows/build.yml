name: Build Flutter Apps

on:
  push:
    branches: [ main, release, claude/dart-mobile-content-blocker-11wcm3 ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.13.0

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --branch $FLUTTER_VERSION --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          export PATH="$HOME/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter doctor -v
          flutter pub get

      - name: Build APK
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter build apk --release --verbose 2>&1 | tee build.log
          echo "✅ APK complete"

      - name: Find and Copy APK
        if: success()
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null | head -5
          echo ""
          if [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            cp build/app/outputs/apk/release/app-release.apk ./app-release.apk
            echo "✅ APK found and copied"
          else
            echo "❌ APK not found at expected location"
            find . -name "*.apk" -type f 2>/dev/null | head -1 | xargs -I {} cp {} ./app-release.apk || echo "Could not find APK"
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unscroll-app-release.apk
          path: app-release.apk
