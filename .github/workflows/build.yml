name: Build Flutter Apps

on:
  push:
    branches: [ main, release, claude/dart-mobile-content-blocker-11wcm3 ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.13.0

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --branch $FLUTTER_VERSION --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          export PATH="$HOME/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter doctor -v
          flutter pub get

      - name: Build APK
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter build apk --release 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ APK build failed"
            exit 1
          fi
          echo "✅ APK build complete"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unscroll-app-release
          path: build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
